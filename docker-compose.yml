version: '3.8'

services:
  backend:
    build: .
    container_name: crowdguard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-crowd2024admin}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:18-alpine
    container_name: crowdguard-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    command: sh -c "npm install --legacy-peer-deps && npm start"
    depends_on:
      - backend
    restart: unless-stopped
